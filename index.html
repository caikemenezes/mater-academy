<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mater Academy</title>
  <meta name="description" content="Plataforma de estudos da Mater Tecnologia: trilha, aulas, notas e entregas.">
  <meta name="theme-color" content="#111a2e">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem("mater-academy:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/">
        <img src="icon.svg" alt="" width="34" height="34">
        <span><b>Mater</b> Academy</span>
      </a>
      <nav class="nav" aria-label="Principal">
        <a href="#/" data-nav="home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
        <a href="#/trilha" data-nav="trilha"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h7"/></svg><span>Trilha</span></a>
        <a href="#/caderno" data-nav="caderno"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/></svg><span>Caderno</span></a>
        <a href="#/plano" data-nav="plano"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>90 dias</span></a>
        <a href="#/ajustes" data-nav="ajustes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Ajustes</span></a>
      </nav>
      <p class="side-foot">Aprender para construir.</p>
    </aside>

    <div class="content">
      <header class="top">
        <a class="brand sm-only" href="#/"><img src="icon.svg" alt="" width="28" height="28"><span><b>Mater</b> Academy</span></a>
        <div class="top-actions">
          <button class="pill-btn" id="syncBtn" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H7a5 5 0 1 1 1.4-9.8A6 6 0 0 1 20 11.5a3.8 3.8 0 0 1-2.5 7.5z"/></svg><span class="lbl">…</span></button>
          <button class="pill-btn timer" id="timerBtn" type="button"></button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema"></button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
